name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    lint:
        name: Lint & typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm format:check
            - run: pnpm typecheck

    test:
        name: Unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm test:coverage
            # Needs the CODECOV_TOKEN repository secret. Without it (e.g. Dependabot PRs) the
            # upload fails quietly and never blocks build or deploy.
            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: coverage/lcov.info
                  disable_search: true
                  flags: unit
                  fail_ci_if_error: false

    fuzz:
        name: Fuzz tests
        runs-on: ubuntu-latest
        env:
            FUZZ_RUNS: "5000"
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # On failure fast-check prints the seed; replay locally with FUZZ_SEED=<seed> pnpm test:fuzz
            - run: pnpm test:fuzz

    e2e:
        name: Soak test & benchmark
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm soak --iterations 150
            - name: Benchmark
              run: pnpm bench --runs 1 --sizes 640x427,1920x1080 --markdown "$GITHUB_STEP_SUMMARY"

    build:
        name: Build
        needs: [lint, test, fuzz, e2e]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            # Screenshots go into dist/showcase/ and ship with Pages, never into git.
            - run: pnpm exec playwright install --with-deps chromium
            - run: node e2e/showcase.ts
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        concurrency:
            group: pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
