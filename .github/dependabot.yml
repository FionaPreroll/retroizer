version: 2
updates:
    - package-ecosystem: npm # also handles pnpm-lock.yaml
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 3
      groups:
          dev-dependencies:
              dependency-type: development
              update-types: [minor, patch]
      open-pull-requests-limit: 10

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ["*"]
