<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Image Retroizer v1</title>
    </head>
    <body>
        <h1>Image Retroizer v1</h1>
        <!-- Status Display Component -->
        <div id="statusDisplayContainer">
            <div id="ledIndicator"></div>
            <div id="displayWrap">
                <div id="statusDisplay">
                    <span id="statusText">READY</span>
                </div>
                <div id="progressContainer">
                    <progress id="renderProgress" value="0" max="100"></progress>
                </div>
            </div>
        </div>

        <div id="controlsContainer">
            <div id="fileControls">
                <input type="file" id="fileInput" accept="image/*" title="Import from File" />
                <button id="pasteClipboard" title="Paste from Clipboard">
                    Paste from Clipboard
                </button>
                <button id="importImage" class="secondary-button" title="Import Cat Image">
                    Import Cat Image
                </button>
            </div>

            <div id="adjustmentControls">
                <div class="control-group">
                    <label for="pixelSize">Pixel Size:</label>
                    <input type="range" id="pixelSize" min="1" max="20" value="4" />
                    <input type="number" id="pixelSizeInput" min="1" max="20" value="4" />
                </div>

                <div class="control-group">
                    <label for="colors">Colors:</label>
                    <input type="range" id="colors" min="2" max="256" value="16" />
                    <input type="number" id="colorsInput" min="2" max="256" value="16" />
                </div>

                <div class="control-group">
                    <label for="scale">Viewport Scale:</label>
                    <input type="range" id="scale" min="0.1" max="2" step="0.1" value="1" />
                    <input type="number" id="scaleInput" min="0.1" max="2" step="0.1" value="1" />
                </div>
            </div>

            <div id="actionControls">
                <button id="resetButton" title="Reset All Parameters">Reset Parameters</button>
                <button id="resetToOriginal" title="Reset to Original Image">
                    Reset to Original
                </button>

                <button
                    id="copyOriginalImage"
                    class="secondary-button"
                    title="Copy Original Image to Clipboard"
                >
                    Copy Original Image
                </button>
                <button id="copyCanvas" title="Copy Canvas to Clipboard">Copy Canvas</button>
                <button id="saveCanvas" class="important-button" title="Save Canvas as Image">
                    Save to File
                </button>

                <button id="renderPalettizeButton" title="Palettize Image">Palettize</button>
                <button id="renderPixelizeButton" title="Pixelize Image">Pixelize</button>
                <button id="renderButton" class="important-button" title="Apply All Effects">
                    Retroize
                </button>

                <button id="undoButton" title="Undo Last Action">Undo</button>
                <button id="redoButton" title="Redo Last Action">Redo</button>
            </div>
        </div>

        <!-- Color Palette Display -->
        <div id="colorPaletteContainer">
            <div id="paletteTitle">
                <span>Palette (initialized)</span>
                <button id="togglePaletteButton">Expand</button>
            </div>
            <div id="colorPalette" style="display: none"></div>
        </div>

        <div id="canvas-container">
            <canvas id="canvas"></canvas>
        </div>

        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
